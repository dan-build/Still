[package]
name = "still"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "still_lib"
crate-type = ["rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
still-core = { path = "../crates/still-core" }
# Maintained by 1Password. No image support: Still only copies text.
arboard = { version = "3.6.1", default-features = false }

# macOS sleep and screen-lock notifications (macos_lock.rs). The same versions
# Tauri and arboard already build on, so nothing new comes in.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSDistributedNotificationCenter", "NSOperation", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
