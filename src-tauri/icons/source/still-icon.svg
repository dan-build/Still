<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Still</title>
  <!-- Still's app icon: the horizon mark on a near-black tile (Night), on
       Apple's macOS grid: an 824px rounded square on a 1024px canvas, with
       the standard soft shadow. Approved on the icon mockup, 2026-10-05. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2F35"/>
      <stop offset="1" stop-color="#0E1012"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <!-- A brighter rim keeps the edge visible on a dark Dock. -->
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#fff" stroke-opacity=".24" stroke-width="4"/>
  <g transform="translate(212.0 212.625) scale(37.5)" fill="none" stroke="#B4C1E6" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 8.25a5 5 0 0 1 10 0"/>
    <path d="M1.75 8.25h12.5M4.25 10.75h7.5M6.5 13.25h3"/>
  </g>
</svg>
